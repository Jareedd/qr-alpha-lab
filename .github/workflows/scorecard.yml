name: live scorecard

on:
  schedule:
    - cron: "30 23 * * 1-5"   # after the 22:30 UTC live cycle, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: render scorecard from committed live logs
        run: python3 scripts/live_scorecard.py

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-scorecard.svg
          git diff --cached --quiet && echo "scorecard unchanged" || {
            git commit -m "scorecard: refresh live-experiment SVG"
            git push
          }

      # Deliberately AFTER the commit, so the stalled banner reaches the
      # committed artifact before the job goes red. A scorecard workflow that
      # can only report success is not monitoring: this one rendered a green
      # check nightly for the five weeks the trading job was dead.
      - name: fail loudly if the live experiment has stalled
        run: python3 scripts/live_scorecard.py --check-stale
